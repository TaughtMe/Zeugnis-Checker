name: Release

on:
  push:
    tags:
      - 'v*' # Trigger bei Tags wie v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build and Publish
        run: npm run build # Ersetzen Sie dies durch Ihren spezifischen Build-Befehl (z.B. electron-builder --publish always)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}